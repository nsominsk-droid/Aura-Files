<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Saved Cloud — Файловый менеджер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text: var(--tg-theme-text-color, #18181b);
      --hint: var(--tg-theme-hint-color, #71717a);
      --link: var(--tg-theme-link-color, #2563eb);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(128, 128, 128, 0.16);
      --danger: #ef4444;
      --folder-color: #f59e0b;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 92px;
      user-select: none;
    }

    /* Шапка и навигация */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn-inline {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: none;
      background: var(--secondary-bg);
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn-inline.visible {
      display: flex;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--secondary-bg);
      color: var(--hint);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Хлебные крошки */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .breadcrumbs::-webkit-scrollbar { display: none; }

    .crumb {
      cursor: pointer;
      white-space: nowrap;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .crumb:hover { background: var(--secondary-bg); }
    .crumb.active {
      color: var(--text);
      font-weight: 600;
    }

    /* Поиск */
    .search-box {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--btn);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--hint);
      pointer-events: none;
    }

    /* Контент */
    .container {
      padding: 14px 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--hint);
      margin: 8px 0 10px;
    }

    /* Сетка папок */
    .folders-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .folder-card {
      background: var(--secondary-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .folder-card:active {
      transform: scale(0.98);
    }

    .folder-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .folder-icon {
      color: var(--folder-color);
      flex-shrink: 0;
    }

    .folder-meta {
      min-width: 0;
    }

    .folder-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-sub {
      font-size: 11px;
      color: var(--hint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Список файлов */
    .files-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-row {
      background: var(--secondary-bg);
      border-radius: var(--radius);
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .file-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .file-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-details {
      font-size: 12px;
      color: var(--hint);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag-pill {
      color: var(--link);
      font-weight: 500;
    }

    .more-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--hint);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .more-btn:active {
      background: var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 42px 20px;
      color: var(--hint);
      font-size: 14px;
    }

    /* Нижняя панель действий */
    .fab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      z-index: 25;
    }

    .action-btn {
      flex: 1;
      height: 46px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .action-btn:active { opacity: 0.85; }

    .btn-secondary {
      background: var(--secondary-bg);
      color: var(--text);
    }

    .btn-primary {
      background: var(--btn);
      color: var(--btn-text);
    }

    /* Модальное окно / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }
    .modal-input:focus {
      border-color: var(--btn);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-item {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: none;
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }
    .menu-item.danger {
      color: var(--danger);
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 27, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header class="header">
    <div class="top-row">
      <div class="title-wrap">
        <button id="inlineBackBtn" class="back-btn-inline" aria-label="Назад">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="currentTitle">Избранное</h1>
      </div>
      <span class="sync-badge" id="syncStatus">Saved Messages</span>
    </div>

    <nav class="breadcrumbs" id="breadcrumbs"></nav>

    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Поиск по имени или #тегу..." />
    </div>
  </header>

  <main class="container">
    <div id="foldersSection">
      <div class="section-label">Папки</div>
      <div class="folders-grid" id="foldersGrid"></div>
    </div>

    <div id="filesSection">
      <div class="section-label">Файлы</div>
      <div class="files-list" id="filesList"></div>
    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
      В этой папке пока пусто.<br/>Создайте подпапку или загрузите файл.
    </div>
  </main>

  <div class="fab-bar">
    <button class="action-btn btn-secondary" id="newFolderBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      Новая папка
    </button>
    <button class="action-btn btn-primary" id="uploadFileBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Загрузить
    </button>
    <input type="file" id="hiddenFileInput" multiple style="display: none;" />
  </div>

  <!-- Модальное окно создания/переименования папки -->
  <div class="modal-backdrop" id="folderModal">
    <div class="modal-sheet">
      <div class="modal-title" id="folderModalTitle">Новая папка</div>
      <input type="text" id="folderNameInput" class="modal-input" placeholder="Например: Договоры 2026" maxlength="40" />
      <div class="modal-actions">
        <button class="action-btn btn-secondary" id="cancelFolderModal">Отмена</button>
        <button class="action-btn btn-primary" id="confirmFolderModal">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Контекстное меню элемента -->
  <div class="modal-backdrop" id="itemMenuModal">
    <div class="modal-sheet">
      <div class="modal-title" id="itemMenuTitle">Действия</div>
      <div class="menu-list" id="itemMenuList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 1. Инициализация Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      try {
        tg?.HapticFeedback?.impactOccurred(type);
      } catch (_) {}
    }

    // 2. Адаптер хранилища (JSON-индекс папок + метаданные файлов)
    // Для подключения реального Telegram "Избранного":
    // - load() запрашивает сообщение с маркером #sys_fm_index и список документов через GramJS
    // - saveIndex() вызывает messages.editMessage для обновления JSON-дерева папок
    // - uploadFile() вызывает client.sendFile("me", { file, caption: folder.tag })
    const StorageAdapter = {
      KEY: 'tg_saved_fm_v1',
      load() {
        const raw = localStorage.getItem(this.KEY);
        if (raw) return JSON.parse(raw);

        // Демонстрационная структура при первом запуске
        const initial = {
          folders: [
            { id: 'f_docs', name: 'Документы', parentId: null, tag: '#документы' },
            { id: 'f_work', name: 'Работа', parentId: null, tag: '#работа' },
            { id: 'f_2026', name: 'Отчеты 2026', parentId: 'f_work', tag: '#работа/отчеты_2026' }
          ],
          files: [
            { id: 1, name: 'Скан_паспорта.pdf', ext: 'PDF', size: '2.1 МБ', date: '18.11.2026', folderId: 'f_docs', tag: '#документы' },
            { id: 2, name: 'Накладная_№412.xlsx', ext: 'XLSX', size: '480 КБ', date: '19.11.2026', folderId: 'f_2026', tag: '#работа/отчеты_2026' },
            { id: 3, name: 'Заметка_быстрая.txt', ext: 'TXT', size: '12 КБ', date: '15.11.2026', folderId: null, tag: '' }
          ]
        };
        this.save(initial);
        return initial;
      },
      save(data) {
        localStorage.setItem(this.KEY, JSON.stringify(data));
      }
    };

    // 3. Состояние приложения
    let state = StorageAdapter.load();
    let currentFolderId = null; // null = корень ("Избранное")
    let searchQuery = '';
    let editingFolderId = null;

    // 4. Утилиты
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function slugifyTag(name) {
      return name.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-zа-яё0-9_]/gi, '');
    }

    function buildFolderTag(name, parentId) {
      const slug = slugifyTag(name) || 'folder';
      if (!parentId) return `#${slug}`;
      const parent = state.folders.find(f => f.id === parentId);
      return parent ? `${parent.tag}/${slug}` : `#${slug}`;
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 Б';
      const units = ['Б', 'КБ', 'МБ', 'ГБ'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function getFolderPath(folderId) {
      const path = [];
      let curr = state.folders.find(f => f.id === folderId);
      while (curr) {
        path.unshift(curr);
        curr = state.folders.find(f => f.id === curr.parentId);
      }
      return path;
    }

    // 5. Навигация и системная кнопка BackButton
    function openFolder(folderId) {
      haptic('light');
      currentFolderId = folderId;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      render();
    }

    function goBack() {
      if (!currentFolderId) return;
      const current = state.folders.find(f => f.id === currentFolderId);
      openFolder(current ? current.parentId : null);
    }

    if (tg?.BackButton) {
      tg.BackButton.onClick(goBack);
    }
    document.getElementById('inlineBackBtn').addEventListener('click', goBack);

    // 6. Рендер интерфейса
    function render() {
      const currentFolder = state.folders.find(f => f.id === currentFolderId);
      document.getElementById('currentTitle').textContent = currentFolder ? currentFolder.name : 'Избранное';

      // Управление кнопкой Назад (в Telegram и в браузере)
      const inlineBack = document.getElementById('inlineBackBtn');
      if (currentFolderId) {
        tg?.BackButton?.show();
        inlineBack.classList.add('visible');
      } else {
        tg?.BackButton?.hide();
        inlineBack.classList.remove('visible');
      }

      // Хлебные крошки
      const breadcrumbsEl = document.getElementById('breadcrumbs');
      const path = getFolderPath(currentFolderId);
      let crumbsHtml = `<span class="crumb ${!currentFolderId ? 'active' : ''}" data-id="">Избранное</span>`;
      path.forEach((folder, idx) => {
        const isLast = idx === path.length - 1;
        crumbsHtml += `<span>/</span><span class="crumb ${isLast ? 'active' : ''}" data-id="${folder.id}">${escapeHtml(folder.name)}</span>`;
      });
      breadcrumbsEl.innerHTML = crumbsHtml;
      breadcrumbsEl.querySelectorAll('.crumb').forEach(el => {
        el.addEventListener('click', () => openFolder(el.dataset.id || null));
      });

      // Фильтрация папок и файлов
      const q = searchQuery.trim().toLowerCase();
      const visibleFolders = q
        ? state.folders.filter(f => f.name.toLowerCase().includes(q) || f.tag.toLowerCase().includes(q))
        : state.folders.filter(f => f.parentId === currentFolderId);

      const visibleFiles = q
        ? state.files.filter(f => f.name.toLowerCase().includes(q) || (f.tag && f.tag.toLowerCase().includes(q)))
        : state.files.filter(f => f.folderId === currentFolderId);

      // Отрисовка папок
      const foldersSection = document.getElementById('foldersSection');
      const foldersGrid = document.getElementById('foldersGrid');
      if (visibleFolders.length > 0) {
        foldersSection.style.display = 'block';
        foldersGrid.innerHTML = visibleFolders.map(folder => {
          const count = state.files.filter(file => file.folderId === folder.id).length;
          return `
            <div class="folder-card" data-folder-id="${folder.id}">
              <div class="folder-left">
                <svg class="folder-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <div class="folder-meta">
                  <div class="folder-name">${escapeHtml(folder.name)}</div>
                  <div class="folder-sub">${count} файл. · ${escapeHtml(folder.tag)}</div>
                </div>
              </div>
              <button class="more-btn" data-menu-type="folder" data-id="${folder.id}" aria-label="Меню папки">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
              </button>
            </div>
          `;
        }).join('');
      } else {
        foldersSection.style.display = 'none';
      }

      // Отрисовка файлов
      const filesSection = document.getElementById('filesSection');
      const filesList = document.getElementById('filesList');
      if (visibleFiles.length > 0) {
        filesSection.style.display = 'block';
        filesList.innerHTML = visibleFiles.map(file => `
          <div class="file-row">
            <div class="file-left">
              <div class="file-badge">${escapeHtml(file.ext || 'FILE')}</div>
              <div class="file-info">
                <div class="file-name">${escapeHtml(file.name)}</div>
                <div class="file-details">
                  <span>${escapeHtml(file.size)}</span>
                  <span>·</span>
                  <span>${escapeHtml(file.date)}</span>
                  ${file.tag ? `<span class="tag-pill">${escapeHtml(file.tag)}</span>` : ''}
                </div>
              </div>
            </div>
            <button class="more-btn" data-menu-type="file" data-id="${file.id}" aria-label="Меню файла">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
          </div>
        `).join('');
      } else {
        filesSection.style.display = 'none';
      }

      // Пустое состояние
      document.getElementById('emptyState').style.display =
        (visibleFolders.length === 0 && visibleFiles.length === 0) ? 'block' : 'none';

      // Навешивание событий на карточки папок и кнопки меню
      foldersGrid.querySelectorAll('.folder-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.more-btn')) return;
          openFolder(card.dataset.folderId);
        });
      });

      document.querySelectorAll('.more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openItemMenu(btn.dataset.menuType, btn.dataset.id);
        });
      });
    }

    // 7. Создание и переименование папок
    const folderModal = document.getElementById('folderModal');
    const folderNameInput = document.getElementById('folderNameInput');

    document.getElementById('newFolderBtn').addEventListener('click', () => {
      haptic('light');
      editingFolderId = null;
      document.getElementById('folderModalTitle').textContent = 'Новая папка';
      folderNameInput.value = '';
      folderModal.classList.add('open');
      setTimeout(() => folderNameInput.focus(), 50);
    });

    document.getElementById('cancelFolderModal').addEventListener('click', () => {
      folderModal.classList.remove('open');
    });

    document.getElementById('confirmFolderModal').addEventListener('click', () => {
      const name = folderNameInput.value.trim();
      if (!name) return;

      if (editingFolderId) {
        const folder = state.folders.find(f => f.id === editingFolderId);
        if (folder) {
          folder.name = name;
          folder.tag = buildFolderTag(name, folder.parentId);
          // Обновляем отображаемый тег у файлов этой папки
          state.files.forEach(file => {
            if (file.folderId === folder.id) file.tag = folder.tag;
          });
          showToast('Папка переименована');
        }
      } else {
        const newFolder = {
          id: 'f_' + Date.now(),
          name,
          parentId: currentFolderId,
          tag: buildFolderTag(name, currentFolderId)
        };
        state.folders.push(newFolder);
        showToast(`Папка «${name}» создана`);
      }

      StorageAdapter.save(state);
      haptic('medium');
      folderModal.classList.remove('open');
      render();
    });

    // 8. Имитация загрузки файлов в текущую папку
    const fileInput = document.getElementById('hiddenFileInput');
    document.getElementById('uploadFileBtn').addEventListener('click', () => {
      haptic('light');
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      const currentFolder = state.folders.find(f => f.id === currentFolderId);
      const today = new Date().toLocaleDateString('ru-RU');

      files.forEach((f, idx) => {
        const parts = f.name.split('.');
        const ext = parts.length > 1 ? parts.pop().slice(0, 4).toUpperCase() : 'FILE';
        state.files.unshift({
          id: Date.now() + idx,
          name: f.name,
          ext,
          size: formatBytes(f.size),
          date: today,
          folderId: currentFolderId,
          tag: currentFolder ? currentFolder.tag : ''
        });
      });

      StorageAdapter.save(state);
      fileInput.value = '';
      haptic('medium');
      showToast(`Загружено файлов: ${files.length}`);
      render();
    });

    // 9. Контекстное меню (переименование, перемещение, удаление)
    const itemMenuModal = document.getElementById('itemMenuModal');
    const itemMenuList = document.getElementById('itemMenuList');

    function openItemMenu(type, id) {
      haptic('light');
      if (type === 'folder') {
        const folder = state.folders.find(f => f.id === id);
        if (!folder) return;
        document.getElementById('itemMenuTitle').textContent = `Папка: ${folder.name}`;
        itemMenuList.innerHTML = `
          <button class="menu-item" id="actRenameFolder">Переименовать</button>
          <button class="menu-item danger" id="actDeleteFolder">Удалить папку (файлы останутся в корне)</button>
          <button class="menu-item" id="actCloseMenu">Отмена</button>
        `;

        document.getElementById('actRenameFolder').onclick = () => {
          itemMenuModal.classList.remove('open');
          editingFolderId = folder.id;
          document.getElementById('folderModalTitle').textContent = 'Переименовать папку';
          folderNameInput.value = folder.name;
          folderModal.classList.add('open');
          setTimeout(() => folderNameInput.focus(), 50);
        };

        document.getElementById('actDeleteFolder').onclick = () => {
          // Переносим файлы и дочерние папки на уровень выше
          state.files.forEach(file => {
            if (file.folderId === folder.id) {
              file.folderId = folder.parentId;
              const parent = state.folders.find(f => f.id === folder.parentId);
              file.tag = parent ? parent.tag : '';
            }
          });
          state.folders.forEach(sub => {
            if (sub.parentId === folder.id) sub.parentId = folder.parentId;
          });
          state.folders = state.folders.filter(f => f.id !== folder.id);
          StorageAdapter.save(state);
          itemMenuModal.classList.remove('open');
          showToast('Папка удалена');
          render();
        };
      } else {
        const file = state.files.find(f => String(f.id) === String(id));
        if (!file) return;
        document.getElementById('itemMenuTitle').textContent = file.name;

        const targetFolders = state.folders.filter(f => f.id !== file.folderId);
        const moveButtons = targetFolders.map(f =>
          `<button class="menu-item" data-move-to="${f.id}">Переместить в «${escapeHtml(f.name)}»</button>`
        ).join('');

        itemMenuList.innerHTML = `
          ${file.folderId ? `<button class="menu-item" data-move-to="">Переместить в корень (Избранное)</button>` : ''}
          ${moveButtons}
          <button class="menu-item danger" id="actDeleteFile">Удалить файл</button>
          <button class="menu-item" id="actCloseMenu">Отмена</button>
        `;

        itemMenuList.querySelectorAll('[data-move-to]').forEach(btn => {
          btn.onclick = () => {
            const targetId = btn.dataset.moveTo || null;
            const targetFolder = state.folders.find(f => f.id === targetId);
            file.folderId = targetId;
            file.tag = targetFolder ? targetFolder.tag : '';
            StorageAdapter.save(state);
            itemMenuModal.classList.remove('open');
            showToast('Файл перемещен');
            render();
          };
        });

        document.getElementById('actDeleteFile').onclick = () => {
          state.files = state.files.filter(f => f.id !== file.id);
          StorageAdapter.save(state);
          itemMenuModal.classList.remove('open');
          showToast('Файл удален');
          render();
        };
      }

      document.getElementById('actCloseMenu').onclick = () => itemMenuModal.classList.remove('open');
      itemMenuModal.classList.add('open');
    }

    // Закрытие модалок по клику на фон
    [folderModal, itemMenuModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('open');
      });
    });

    // Поиск
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Первый рендер
    render();
  </script>
</body>
</html>
